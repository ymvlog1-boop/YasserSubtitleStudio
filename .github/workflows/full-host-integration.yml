name: Yasser Subtitle Studio full Windows build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-integrated-host.ps1'
      - 'src/Yasser.ResumeCore/**'
      - 'src/Yasser.SubtitleDesktop/**'
      - 'NOTICE-UPSTREAM.txt'
      - '.github/workflows/full-host-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-host:
    name: Build and verify Yasser Subtitle Studio
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Yasser source
        uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test resume checkpoints and SRT recovery
        shell: pwsh
        run: dotnet run --project tests/Yasser.ResumeCore.SmokeTests/Yasser.ResumeCore.SmokeTests.csproj --configuration Release
      - name: Test online translation checkpoints with mock provider
        shell: pwsh
        run: dotnet run --project tests/Yasser.OnlineTranslation.SmokeTests/Yasser.OnlineTranslation.SmokeTests.csproj --configuration Release
      - name: Compile full pinned Subtitle Edit original with Yasser project menu
        shell: pwsh
        run: ./scripts/build-integrated-host.ps1
      - name: Verify branded Windows executable, original icon and license
        shell: pwsh
        run: |
          $exe = 'out/integrated-host-win-x64/YasserSubtitleStudio.exe'
          if (!(Test-Path $exe)) { throw 'YasserSubtitleStudio.exe missing.' }
          if (!(Test-Path 'out/integrated-host-win-x64/SubtitleEdit.exe')) { throw 'Original host executable missing.' }
          if (!(Test-Path 'out/integrated-host-source/src/ui/SE.ico')) { throw 'Original Subtitle Edit icon missing.' }
          if (!(Test-Path 'out/integrated-host-win-x64/UPSTREAM-LICENSE.txt')) { throw 'Upstream license missing.' }
          if (!(Test-Path 'out/integrated-host-win-x64/NOTICE-YASSER-UPSTREAM.txt')) { throw 'Upstream notice missing.' }
          Write-Host 'Integrated branded Windows package verified.'
      - name: Startup smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'out/integrated-host-win-x64/YasserSubtitleStudio.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "Yasser Subtitle Studio exited during startup with code $($p.ExitCode)." }
          } else {
            Stop-Process -Id $p.Id -Force
          }
          Write-Host 'Yasser Subtitle Studio started successfully.'
      - name: Upload final Windows package
        uses: actions/upload-artifact@v4
        with:
          name: YasserSubtitleStudio-FINAL-win-x64
          path: out/integrated-host-win-x64/
          if-no-files-found: error
          retention-days: 90
