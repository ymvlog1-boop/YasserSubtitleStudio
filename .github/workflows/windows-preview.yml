name: Build and test Windows desktop preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/windows-preview.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    name: Smoke tests and Windows preview
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run core smoke tests
        shell: pwsh
        run: dotnet run --project tests/Yasser.ResumeCore.SmokeTests/Yasser.ResumeCore.SmokeTests.csproj --configuration Release
      - name: Run online translation checkpoint tests (mock API, no real content uploaded)
        shell: pwsh
        run: dotnet run --project tests/Yasser.OnlineTranslation.SmokeTests/Yasser.OnlineTranslation.SmokeTests.csproj --configuration Release
      - name: Obtain the original Subtitle Edit Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstreamCommit = '7398eb9d63769753960bb25326d4bae53971b55b'
          $url = "https://raw.githubusercontent.com/SubtitleEdit/subtitleedit/$upstreamCommit/src/ui/SE.ico"
          $icon = 'src/Yasser.SubtitleDesktop/Assets/SE.ico'
          New-Item -ItemType Directory -Force -Path (Split-Path $icon) | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $icon -MaximumRedirection 5
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $icon))
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw 'Upstream icon download was not a valid ICO file.'
          }
          Write-Host 'Official upstream icon is ready for Windows executable branding.'
      - name: Publish standalone Windows desktop preview
        shell: pwsh
        run: dotnet publish src/Yasser.SubtitleDesktop/Yasser.SubtitleDesktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output out/win-x64-preview
      - name: Verify original icon is included with Windows build
        shell: pwsh
        run: |
          if (!(Test-Path 'out/win-x64-preview/YasserSubtitleStudio.exe') -or !(Test-Path 'out/win-x64-preview/SE.ico')) {
            throw 'Windows executable or original icon is missing from build.'
          }
      - name: Upload preview build (NOT integrated Subtitle Edit)
        uses: actions/upload-artifact@v4
        with:
          name: YasserSubtitleStudio-standalone-preview-win-x64
          path: out/win-x64-preview/
          if-no-files-found: error
          retention-days: 30
